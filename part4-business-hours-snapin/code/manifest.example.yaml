# Part 4 - Business Hours Validator snap-in manifest - CANDIDATE EXAMPLE (NOT a verified,
# importable deployment manifest). It is named manifest.example.yaml so it is NOT mistaken
# for a deploy-ready manifest. The STRUCTURE below (version, service_account.scopes.self as a
# list, functions, operations with slug/function/type/inputs/outputs/static_scopes.self/
# execute_options) matches the official template (devrev/snap-in-examples 14-operations/
# manifest.yaml and devrev/devrev-snaps-typescript-template/manifest.yaml).
#
# BEFORE DEPLOY: copy this to ../manifest.yaml (the manifest lives at the PROJECT ROOT, a
# sibling of code/, NOT inside code/), then CLI-validate the scopes with your SDK/CLI version
# (`devrev snap_in_version create`). The exact scope SLUG is still CLI-unverified here - see
# VERIFY-SCOPES. Do not deploy with an unvalidated scope.

version: "2"

name: business-hours-validator
description: >-
  Custom operation (3P node) that checks whether a timestamp falls within an organization's
  configured business hours, for conversation routing. edison-org-for-test only.

service_account:
  display_name: Business Hours Validator Bot
  # VERIFY-SCOPES: parent internal reference ART-15419 indicates org-schedules reads need
  # `org_schedule:read` (or the readwrite/all variant). The scope SLUG is grounded to that
  # reference but still MUST be CLI-validated against your platform version before deploy.
  scopes:
    self:
      - scope: org_schedule:read
        optional: false
        reason: Read the business-hours schedule.

functions:
  - name: business_hours_validator
    description: Evaluate whether a timestamp is within the org's business hours.

operations:
  - name: business_hours_validator
    display_name: Business Hour Validator
    description: >-
      Receives a timestamp and an org schedule id and returns whether the timestamp is
      within business hours, plus the next opening time if it is not.
    slug: business-hours-validator
    function: business_hours_validator
    type: action
    # VERIFY-SCOPES: operation static_scopes gate the org-schedules.evaluate call. Grounded to
    # ART-15419 (org_schedule:read); CLI-validate before deploy. `static_scopes.self` is the
    # list shape used by the official 14-operations example.
    static_scopes:
      self:
        - scope: org_schedule:read
          optional: false
          reason: Evaluate the business-hours schedule.
    inputs:
      fields:
        - name: org_schedule_id
          description: The organization schedule to evaluate against.
          field_type: text
          is_required: true
          ui:
            display_name: Org schedule ID
        - name: timestamp
          description: ISO-8601 timestamp with offset to evaluate.
          field_type: text
          is_required: true
          ui:
            display_name: Timestamp
    outputs:
      fields:
        - name: is_within_business_hours
          description: True if the timestamp falls within business hours.
          field_type: bool
          ui:
            display_name: Is within business hours
        - name: next_open_time
          description: Next opening time; empty if active or unknown.
          field_type: text
          ui:
            display_name: Next open time
        - name: evaluated_at
          description: The normalized ISO-8601 instant that was evaluated.
          field_type: text
          ui:
            display_name: Evaluated at
    # Bounded execution timeout (seconds). The adapter also enforces an 8s HTTP timeout on the
    # org-schedules.evaluate call (EVALUATE_TIMEOUT_MS).
    execute_options:
      default_timeout: 30
